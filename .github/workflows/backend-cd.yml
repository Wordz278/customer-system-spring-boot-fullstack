name: CD - Deploy Backend

# --------------------------------------------------
# Workflow trigger
# --------------------------------------------------
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - backend/**

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: customer
        ports:
          - 5332:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - uses: actions/checkout@v7


      # --------------------------------------------------
      # Slack - Deployment started
      # --------------------------------------------------
      - name: Send Slack Message - Deployment started
        run: > 
          curl -X POST -H 'Content-type: application/json' --data ' {"text":"Deployment started :progress_bar: :fingerscrossed:"} ' ${{ secrets.SLACK_WEBHOOK_URL }}

      # --------------------------------------------------
      # Setup Java
      # --------------------------------------------------
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'


      # --------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Set build number
        id: build-number
        run: echo "BUILD_NUMBER=$(TZ=Africa/Johannesburg date '+%d.%m.%Y.%H.%M.%S')" >> $GITHUB_OUTPUT


      # --------------------------------------------------
      # Slack - Maven build started
      # --------------------------------------------------
      - name: Send Slack Message
        run: >
          curl -X POST -H 'Content-type: application/json' --data ' {"text":":maven: Building with Maven :maven:"} ' ${{ secrets.SLACK_WEBHOOK_URL }}

      # --------------------------------------------------
      # Build, test and push Docker image
      # --------------------------------------------------
      - name: Build Package Push with Maven
        env:
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: mvn -ntp -B verify -Ddocker.image.tag=${{steps.build-number.outputs.BUILD_NUMBER}} jib:build

      # --------------------------------------------------
      # Slack - Docker image pushed
      # --------------------------------------------------
      - name: Send Slack Message
        run: >
          curl -X POST -H 'Content-type: application/json' --data ' {"text":":docker: Image tag:${{steps.build-number.outputs.BUILD_NUMBER}} pushed to https://hub.docker.com/repository/docker/wordz278/adrian-api"} ' ${{ secrets.SLACK_WEBHOOK_URL }}

      # --------------------------------------------------
      # Update Dockerrun.aws.json
      # --------------------------------------------------
      - name: Update Dockerrun.aws.json api image tage with new build number
        run: |
          echo "Dockerrun.aws.json before updating tag"
          cat Dockerrun.aws.json
          sed -i -E 's_(wordz278/adrian-api:)([^"]*)_\1'${{steps.build-number.outputs.BUILD_NUMBER}}'_' Dockerrun.aws.json
          echo "Dockerrun.aws.json after updating tag"
          cat Dockerrun.aws.json

      # --------------------------------------------------
      # Slack - Elastic Beanstalk deployment started
      # --------------------------------------------------
      - name: Send Slack Message
        run: >
          curl -X POST -H 'Content-type: application/json' --data ' {"text":":aws: Starting deployment to Elastic Beanstalk"} ' ${{ secrets.SLACK_WEBHOOK_URL }}

      # --------------------------------------------------
      # Deploy to Elastic Beanstalk
      # --------------------------------------------------
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          version_label: ${{ steps.build-number.outputs.BUILD_NUMBER }}
          version_description: ${{ github.SHA }}
          region: ${{ secrets.EB_REGION }}
          deployment_package: backend/Dockerrun.aws.json

      # --------------------------------------------------
      # Slack - Commit started
      # --------------------------------------------------
      - name: Send Slack Message
        run: >
          curl -X POST -H 'Content-type: application/json' --data ' {"text":":githubloading: Committing to repo https://github.com/Wordz278/customer-system-spring-boot-fullstack/"} ' ${{ secrets.SLACK_WEBHOOK_URL }}

      # --------------------------------------------------
      # Commit and push updated Dockerrun.aws.json
      # --------------------------------------------------
      - name: Commit and push Dockerrun.aws.json
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update Dockerrun.aws.json docker image with new tag ${{ steps.build-number.outputs.BUILD_NUMBER }}"
          git push

      # --------------------------------------------------
      # Slack - Deployment successful
      # --------------------------------------------------
      - name: Send Slack Message
        run: >
          curl -X POST -H 'Content-type: application/json' --data ' {"text":"Deployment and commit completed :github_check_mark: :part_blob: - http://adrian-api-env.eba-2qgz2vjx.af-south-1.elasticbeanstalk.com/"} ' ${{ secrets.SLACK_WEBHOOK_URL }}

      # --------------------------------------------------
      # Slack - Final job status
      # --------------------------------------------------
      - name: Send Slack Message
        if: always()
        run: >
          curl -X POST -H 'Content-type: application/json' --data ' {"text":"Job Status ${{ job.status }}"} ' ${{ secrets.SLACK_WEBHOOK_URL }}